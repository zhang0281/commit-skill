interface:
  display_name: "Commit"
  short_description: "固定候选提交后，仅用 AI 生成 commit message，其余全部脚本执行"
  default_prompt: >-
    显式 $commit 先按首个非空 token 分流：严格为 doctor 时只执行 doctor；其他输入才进入提交流程。doctor 后的自然语言只能选择静态诊断或 --probe，不启动 commit-session。提交流程不先搜索 memory，不读取其他 skill，不启用子代理，也不另跑 git diff、tests、coverage、inventory、git status 或 git verify-commit。默认启动一次可保持 stdin 的 commit-session --repo . --json；读取 phase=prepared，其中 semantic_diff 已含 message 所需语义。若 message_source=custom-model，等待脚本后续 phase；脚本成功输出 phase=complete 前，宿主不得生成或写入 messages JSON。若随后收到 phase=fallback 且 message_source=stdin，说明 custom model 已完成首次请求加两次重试仍失败，此时才填写并通过同一进程 stdin 回写 commits[].id/type/title/bullets，再等待 phase=complete。若 message_source=stdin，则直接回写 message JSON。若使用 --require-custom-model，模型连续失败会直接返回 MODEL_REQUEST_FAILED，不会出现 fallback phase。禁止改 paths、repo_path、sign_mode、commit 数量与顺序。脚本负责 merge、preflight、coverage、snapshot drift、submodule 顺序、signing、git commit、验签、最终 inventory、clean-tree 与 fingerprint 复核；phase=complete 即最终证据，不再补跑命令。若 phase=prepared 后立即返回 MESSAGE_FILE_INVALID 或 stdin transport failure，不要盲目重启 session，按既有 fast-commit 回退流程处理。最终回复使用 summary/plan/result/remaining/next_step。
