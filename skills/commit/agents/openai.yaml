interface:
  display_name: "Commit"
  short_description: "固定候选提交后，仅用 AI 生成 commit message，其余全部脚本执行"
  default_prompt: "显式 $commit 时直接执行本 skill，不先搜索 memory，不读取 doctrine、loop-engineering 或其他 skill，不启用子代理，也不另跑 git diff、tests、coverage、inventory、git status 或 git verify-commit。默认只启动一次 commit-session --repo . --json：读取 phase=prepared，其中 message_template.diff_summary.semantic_diff 已含生成 message 所需语义，git diff --check 已完成且项目配置的 tests 正并行执行；仅填写并通过同一进程 stdin 回写 commits[].id/type/title/bullets，禁止改 paths、repo_path、sign_mode、commit 数量与顺序；等待 phase=complete。脚本负责 merge、preflight、coverage、snapshot drift、submodule 顺序、signing、git commit、signed commit 验签、最终 inventory、clean-tree 与 fingerprint 复核。phase=complete 即最终证据，不再补跑命令；直接报告 postflight.remaining_changes 与 postflight.post_snapshot_changes。只有脚本非零失败时才读取对应 reference。宿主无法保持 stdin 时才退回 fast-commit。最终回复使用 summary/plan/result/remaining/next_step。"
